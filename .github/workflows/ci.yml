name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
        env:
          PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_placeholder'
